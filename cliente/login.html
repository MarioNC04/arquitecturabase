<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Login - Arquitectura base</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
  <div class="container" style="max-width:600px; margin-top:40px;">
    <div id="fmLogin">
      <form>
        <div class="form-group">
          <label for="email">Dirección email:</label>
          <input type="email" class="form-control" placeholder="Introduce email" id="email">
        </div>
        <div class="form-group">
          <label for="pwd">Password:</label>
          <input type="password" class="form-control" placeholder="Introduce password" id="pwd">
        </div>
        <button type="submit" id="btnLogin" class="btn btn-primary">Iniciar sesión</button>
      </form>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script>
    $(function(){
      $('#btnLogin').on('click', function(e){
        e.preventDefault();
        const email = $('#email').val().trim();
        const pwd = $('#pwd').val();
        if (!email || !pwd) { alert('Introduce email y contraseña'); return; }
        $('#btnLogin').prop('disabled', true).text('Iniciando...');
        if (typeof rest !== 'undefined' && typeof rest.loginUsuario === 'function') {
          rest.loginUsuario(email, pwd);
          setTimeout(function(){ $('#btnLogin').prop('disabled', false).text('Iniciar sesión'); }, 1000);
          return;
        }

        $.ajax({
          type: 'POST',
          url: '/loginUsuario',
          data: JSON.stringify({ email: email, password: pwd }),
          contentType: 'application/json',
          success: function(data) {
            if (!data || typeof data.nick === 'undefined') {
              alert('Respuesta inesperada del servidor');
              return;
            }
            if (data.nick === -1) {
              alert('Email no registrado o contraseña incorrecta');
            } else if (data.nick === -2) {
              alert('Cuenta no confirmada. Revisa tu correo.');
            } else {
              document.cookie = 'nick=' + encodeURIComponent(data.nick) + ';path=/';
              window.location = '/';
            }
          },
          error: function(xhr, status, err) {
            console.error('login error', status, err, xhr.responseText);
            alert('Error al iniciar sesión. Revisa la consola.');
          },
          complete: function() {
            $('#btnLogin').prop('disabled', false).text('Iniciar sesión');
          }
        });
      });
    });
  </script>
</body>
</html>
